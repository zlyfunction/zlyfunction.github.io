<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Upside Down - Demogorgon</title>
  <style>
    body {
      margin: 0;
      background-color: #050000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
      pointer-events: none;
      z-index: 10;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      text-align: center;
      max-width: 80%;
    }

    a {
      color: #ff0000;
      pointer-events: auto;
      text-decoration: none;
      border: 1px solid #ff0000;
      padding: 5px 10px;
      margin-top: 10px;
      display: inline-block;
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>WARNING: GATE OPEN</h1>
    <p>LOCATION: HAWKINS NATIONAL LABORATORY</p>
    <a href="index.html">RUN BACK HOME</a>
  </div>
  <div id="loading" class="loading">Locating Demogorgon...</div>

  <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, model;
    let flashLight;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050000);
      scene.fog = new THREE.FogExp2(0x050000, 0.15);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 灯光设置
      const ambientLight = new THREE.AmbientLight(0x404040, 0.5); // 极弱的环境光
      scene.add(ambientLight);

      flashLight = new THREE.PointLight(0xff0000, 100, 10);
      flashLight.position.set(2, 3, 2);
      flashLight.castShadow = true;
      scene.add(flashLight);

      const blueLight = new THREE.PointLight(0x0000ff, 20, 10);
      blueLight.position.set(-2, 1, -2);
      scene.add(blueLight);

      // 加载模型
      const loader = new GLTFLoader();
      loader.load('demogorgon.glb', (gltf) => {
        model = gltf.scene;
        model.traverse(n => { if (n.isMesh) n.castShadow = n.receiveShadow = true; });

        // 自动居中和缩放调整
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        scene.add(model);
        document.getElementById('loading').style.display = 'none';
      },
        (xhr) => { console.log((xhr.loaded / xhr.total * 100) + '% loaded'); },
        (error) => {
          console.error(error);
          let msg = 'Error: demogorgon.glb not found';
          if (window.location.protocol === 'file:') {
            msg = '⚠️ 浏览器安全限制：无法通过 file:// 协议加载 3D 模型。<br><br>请使用 VS Code 的 <b>Live Server</b> 插件或 Python <b>http.server</b> 运行此页面。';
          } else {
            msg = 'ERROR: Could not find "demogorgon.glb" in the current folder.';
          }
          document.getElementById('loading').innerText = msg;
          document.getElementById('loading').style.color = '#ff0000';
        });

      // 添加 Upside Down 的灰烬粒子
      createParticles();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function createParticles() {
      const geo = new THREE.BufferGeometry();
      const pos = [];
      for (let i = 0; i < 2000; i++) {
        pos.push(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.02, transparent: true, opacity: 0.6 });
      const particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // 模拟灯光闪烁
      if (Math.random() > 0.9) {
        flashLight.intensity = Math.random() * 150;
      } else {
        flashLight.intensity = 50;
      }

      if (model) model.rotation.y += 0.005;

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>

</html>
