<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Upside Down - Demogorgon</title>
  <style>
    body {
      margin: 0;
      background-color: #050000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
      pointer-events: none;
      z-index: 10;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      text-align: center;
      max-width: 80%;
    }

    a {
      color: #ff0000;
      pointer-events: auto;
      text-decoration: none;
      border: 1px solid #ff0000;
      padding: 5px 10px;
      margin-top: 10px;
      display: inline-block;
    }

    #settings-panel {
      position: absolute;
      right: 20px;
      top: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff0000;
      padding: 15px;
      color: #ff0000;
      font-family: 'Courier New', monospace;
      z-index: 100;
      pointer-events: auto;
      width: 220px;
      font-size: 12px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group label {
      display: block;
      margin-bottom: 5px;
    }

    .control-group input {
      width: 100%;
      cursor: pointer;
      accent-color: #ff0000;
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>WARNING: GATE OPEN</h1>
    <p>LOCATION: HAWKINS NATIONAL LABORATORY</p>
    <a href="index.html">RUN BACK HOME</a>
  </div>

  <div id="settings-panel">
    <div style="border-bottom: 1px solid #ff0000; margin-bottom: 10px; padding-bottom: 5px; font-weight: bold;">RENDER
      CONSOLE</div>
    <div class="control-group">
      <label>EXPOSURE</label>
      <input type="range" id="exposure-slider" min="0" max="5" step="0.1" value="1.5">
    </div>
    <div class="control-group">
      <label>AMBIENT LIGHT</label>
      <input type="range" id="ambient-slider" min="0" max="5" step="0.1" value="1.2">
    </div>
    <div class="control-group">
      <label>MAIN LIGHT</label>
      <input type="range" id="main-light-slider" min="0" max="10" step="0.1" value="2.0">
    </div>
    <div class="control-group">
      <label>FLICKER BASE</label>
      <input type="range" id="flicker-slider" min="0" max="500" step="10" value="50">
    </div>
    <div class="control-group" style="display: flex; align-items: center; gap: 10px;">
      <label style="margin-bottom: 0;">WIREFRAME MODE</label>
      <input type="checkbox" id="wireframe-check" style="width: auto;">
    </div>
  </div>

  <div id="loading" class="loading">Locating Demogorgon...</div>

  <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, model, ambientLight, mainLight, flashLight;
    let flickerBase = 50;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050000);
      scene.fog = new THREE.FogExp2(0x050000, 0.15);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      // 开启色调映射，让模型亮度更自然
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.5;
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 灯光设置
      ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      // 增加一个强力的主方向光，从斜上方照亮模型
      mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
      mainLight.position.set(5, 10, 7.5);
      scene.add(mainLight);

      flashLight = new THREE.PointLight(0xff0000, 150, 15);
      flashLight.position.set(2, 3, 2);
      flashLight.castShadow = true;
      scene.add(flashLight);

      const blueLight = new THREE.PointLight(0x0000ff, 20, 10);
      blueLight.position.set(-2, 1, -2);
      scene.add(blueLight);

      // 加载模型
      const loader = new GLTFLoader();
      loader.load('demogorgon.glb', (gltf) => {
        model = gltf.scene;
        model.traverse(n => { if (n.isMesh) n.castShadow = n.receiveShadow = true; });

        // 自动居中和缩放调整
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        scene.add(model);
        document.getElementById('loading').style.display = 'none';
      },
        (xhr) => {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('loading').innerText = `Summoning Demogorgon... ${percent}%`;
        },
        (error) => {
          console.error(error);
          let msg = 'Error: demogorgon.glb not found';
          if (window.location.protocol === 'file:') {
            msg = '⚠️ Browser Security Restriction: Cannot load 3D models via file:// protocol.<br><br>Please use VS Code <b>Live Server</b> or a local web server.';
          } else {
            msg = 'ERROR: Could not find "demogorgon.glb" in the current folder.<br>Check filename casing or ensure the file is uploaded to GitHub.';
          }
          document.getElementById('loading').innerText = msg;
          document.getElementById('loading').style.color = '#ff0000';
        });

      // 添加 Upside Down 的灰烬粒子
      createParticles();

      // 绑定控制台事件
      document.getElementById('exposure-slider').addEventListener('input', (e) => {
        renderer.toneMappingExposure = parseFloat(e.target.value);
      });
      document.getElementById('wireframe-check').addEventListener('change', (e) => {
        if (model) {
          model.traverse(n => {
            if (n.isMesh) {
              n.material.wireframe = e.target.checked;
            }
          });
        }
      });
      document.getElementById('ambient-slider').addEventListener('input', (e) => {
        ambientLight.intensity = parseFloat(e.target.value);
      });
      document.getElementById('main-light-slider').addEventListener('input', (e) => {
        mainLight.intensity = parseFloat(e.target.value);
      });
      document.getElementById('flicker-slider').addEventListener('input', (e) => {
        flickerBase = parseFloat(e.target.value);
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function createParticles() {
      const geo = new THREE.BufferGeometry();
      const pos = [];
      for (let i = 0; i < 2000; i++) {
        pos.push(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * 10 - 5);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.02, transparent: true, opacity: 0.6 });
      const particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // 模拟灯光闪烁
      if (Math.random() > 0.9) {
        flashLight.intensity = Math.random() * 150;
      } else {
        flashLight.intensity = flickerBase;
      }

      if (model) model.rotation.y += 0.005;

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>

</html>
